<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172b">
  <title>星星快手 · 20 秒反应挑战</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1325;
      --panel: rgba(24, 33, 57, .82);
      --line: rgba(255,255,255,.1);
      --text: #f4f5fb;
      --muted: #a3aec9;
      --mint: #8ff0d0;
      --yellow: #ffe28a;
      --pink: #ff9fc5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 30px 18px;
      display: grid; place-items: center; overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(92,105,190,.26), transparent 35%),
        radial-gradient(ellipse at 85% 85%, rgba(54,163,147,.18), transparent 34%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .app { width: min(100%, 720px); }
    .topline { display:flex; align-items:center; gap:9px; color:var(--mint); font-size:12px; font-weight:800; letter-spacing:.16em; }
    .topline span { width:8px; height:8px; border-radius:50%; background:var(--mint); box-shadow:0 0 14px var(--mint); }
    header { text-align:center; margin: 18px 0 25px; }
    h1 { margin:0; font-size:clamp(38px,8vw,58px); line-height:1.05; letter-spacing:-.06em; }
    h1 em { color:var(--yellow); font-style:normal; }
    .subtitle { color:var(--muted); margin:13px 0 0; font-size:14px; }
    .panel {
      border:1px solid var(--line); border-radius:24px; padding:20px;
      background:var(--panel); box-shadow:0 24px 80px rgba(0,0,0,.28);
      backdrop-filter:blur(18px);
    }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:15px; }
    .stat { padding:13px 10px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.035); text-align:center; }
    .stat-label { display:block; color:var(--muted); font-size:11px; margin-bottom:5px; }
    .stat-value { font-size:clamp(23px,5vw,30px); line-height:1; font-weight:800; font-variant-numeric:tabular-nums; }
    .stat:nth-child(1) .stat-value { color:var(--yellow); }
    .stat:nth-child(2) .stat-value { color:var(--mint); }
    .stat:nth-child(3) .stat-value { color:var(--pink); }
    .arena {
      position:relative; height:350px; overflow:hidden; border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(circle at 50% 45%, rgba(87,111,176,.18), transparent 50%),
        linear-gradient(145deg, rgba(16,25,47,.92), rgba(20,38,59,.9));
      isolation:isolate;
    }
    .arena::before {
      content:""; position:absolute; inset:0; opacity:.22; pointer-events:none;
      background-image:radial-gradient(rgba(255,255,255,.55) .8px,transparent .8px);
      background-size:27px 27px;
    }
    .hint {
      position:absolute; inset:0; display:grid; place-content:center; gap:9px;
      text-align:center; color:var(--muted); pointer-events:none; padding:20px;
    }
    .hint-icon { font-size:42px; }
    .hint strong { color:var(--text); font-size:17px; }
    .hint small { font-size:12px; }
    .target {
      position:absolute; z-index:2; width:64px; height:64px; display:none;
      place-items:center; border:0; border-radius:50%; cursor:pointer;
      color:#554018; font-size:31px; line-height:1;
      background:radial-gradient(circle at 35% 28%, #fff8cd, #ffdd76 58%, #f7ad4f);
      box-shadow:0 0 0 8px rgba(255,226,138,.12), 0 0 34px rgba(255,211,103,.52), inset 0 -4px 8px rgba(157,94,21,.15);
      transform:translate(-50%,-50%);
      transition:filter .12s, width .12s, height .12s;
      animation:pop .18s ease-out;
      -webkit-tap-highlight-color:transparent;
    }
    .target:hover { filter:brightness(1.08); }
    .target:active { width:58px; height:58px; }
    @keyframes pop { from { opacity:0; scale:.55; } to { opacity:1; scale:1; } }
    .float-score {
      position:absolute; z-index:3; pointer-events:none; color:var(--mint);
      font-size:20px; font-weight:900; animation:float-up .65s ease-out forwards;
    }
    @keyframes float-up { to { opacity:0; transform:translateY(-42px) scale(1.2); } }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:15px; }
    .status { color:var(--muted); font-size:12px; line-height:1.5; }
    .status strong { color:var(--text); }
    .main-btn {
      flex:0 0 auto; border:0; border-radius:13px; padding:13px 21px;
      color:#10251f; background:var(--mint); font-weight:850; cursor:pointer;
      box-shadow:0 8px 24px rgba(143,240,208,.16); transition:transform .15s, filter .15s;
    }
    .main-btn:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .main-btn:active { transform:translateY(0); }
    .main-btn:focus-visible, .target:focus-visible { outline:3px solid white; outline-offset:4px; }
    .footer { text-align:center; color:#74809f; font-size:11px; margin-top:17px; }
    @media (max-width:520px) {
      body { padding:22px 13px; }
      .panel { padding:13px; border-radius:20px; }
      .arena { height: min(62vh,380px); min-height:290px; }
      .controls { align-items:flex-start; flex-direction:column; }
      .main-btn { width:100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline"><span></span> MINI ARCADE · 反应力实验室</div>
    <header>
      <h1>星星<em>快手</em></h1>
      <p class="subtitle">眼疾手快！在 20 秒内，尽可能多地收集星星。</p>
    </header>

    <section class="panel" aria-label="星星快手游戏">
      <div class="stats" aria-live="polite">
        <div class="stat"><span class="stat-label">当前得分</span><span class="stat-value" id="score">0</span></div>
        <div class="stat"><span class="stat-label">剩余时间</span><span class="stat-value" id="time">20</span></div>
        <div class="stat"><span class="stat-label">个人最佳</span><span class="stat-value" id="best">0</span></div>
      </div>

      <div class="arena" id="arena">
        <div class="hint" id="hint">
          <div class="hint-icon">🌟</div>
          <strong>准备好了吗？</strong>
          <small>点击开始，然后快速点击出现的星星</small>
        </div>
        <button class="target" id="target" type="button" aria-label="点击星星得分">★</button>
      </div>

      <div class="controls">
        <div class="status" id="status" aria-live="polite"><strong>游戏规则：</strong>每点中一颗星星得 1 分。</div>
        <button class="main-btn" id="start" type="button">开始挑战 →</button>
      </div>
    </section>
    <p class="footer">一个小小的网页游戏 · 不需要下载 · 成绩保存在当前浏览器</p>
  </main>

  <script>
    (() => {
      const DURATION = 20;
      const arena = document.getElementById("arena");
      const target = document.getElementById("target");
      const hint = document.getElementById("hint");
      const startButton = document.getElementById("start");
      const scoreLabel = document.getElementById("score");
      const timeLabel = document.getElementById("time");
      const bestLabel = document.getElementById("best");
      const status = document.getElementById("status");

      let score = 0;
      let endAt = 0;
      let timerId = null;
      let playing = false;
      let best = readBest();
      bestLabel.textContent = best;

      function readBest() {
        try { return Number(localStorage.getItem("star-hands-best")) || 0; }
        catch (_) { return 0; }
      }

      function saveBest(value) {
        try { localStorage.setItem("star-hands-best", String(value)); }
        catch (_) { /* 浏览器禁用本地存储时，游戏仍可正常进行 */ }
      }

      function moveTarget() {
        const x = 10 + Math.random() * 80;
        const y = 14 + Math.random() * 72;
        target.style.left = x + "%";
        target.style.top = y + "%";
      }

      function updateTime() {
        const remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        timeLabel.textContent = remaining;
        if (remaining <= 0) finishGame();
      }

      function startGame() {
        clearInterval(timerId);
        score = 0;
        playing = true;
        scoreLabel.textContent = "0";
        timeLabel.textContent = DURATION;
        hint.hidden = true;
        target.style.display = "grid";
        startButton.textContent = "重新开始 ↻";
        status.textContent = "加油！星星正在出现，点击它们！";
        endAt = Date.now() + DURATION * 1000;
        moveTarget();
        timerId = setInterval(updateTime, 100);
      }

      function finishGame() {
        if (!playing) return;
        playing = false;
        clearInterval(timerId);
        target.style.display = "none";
        hint.hidden = false;
        hint.innerHTML = '<div class="hint-icon">🏆</div><strong>挑战完成！你获得了 ' + score + ' 分</strong><small>' + (score > best ? "新纪录诞生！太厉害了！" : "再来一次，刷新自己的纪录吧！") + '</small>';
        if (score > best) {
          best = score;
          bestLabel.textContent = best;
          saveBest(best);
        }
        status.innerHTML = "<strong>本次成绩：</strong>" + score + " 分 · 准备好再挑战一次了吗？";
        startButton.textContent = "再玩一次 →";
        timeLabel.textContent = "0";
      }

      target.addEventListener("click", () => {
        if (!playing) return;
        score += 1;
        scoreLabel.textContent = score;
        const popup = document.createElement("span");
        popup.className = "float-score";
        popup.textContent = "+1";
        popup.style.left = target.style.left;
        popup.style.top = target.style.top;
        arena.appendChild(popup);
        popup.addEventListener("animationend", () => popup.remove(), { once: true });
        moveTarget();
      });

      startButton.addEventListener("click", startGame);
    })();
  </script>
</body>
</html>
